name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Python lint, format and types
        run: |
          ruff check backend
          ruff format --check backend
          mypy
      - name: Backend and contract checks
        run: |
          pytest
          python tools/export_openapi.py --check
          PYTHON=python npm run test:contracts
          npm run test:prototypes
          npm run check:web-validators
          python tools/release_contracts.py --check
      - name: Frontend checks and build
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test:frontend
          npm run build
      - name: Browser acceptance with synthetic Google fixtures
        run: |
          npx playwright install --with-deps chromium firefox
          npm run test:browser

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: box-storage-memory:local
      - name: Start Compose and check deployment
        run: |
          docker compose up --no-build --wait --wait-timeout 90
          python3 tools/smoke_http.py http://localhost:8080
          python3 tools/smoke_api.py http://localhost:8080
          python3 tools/check_running_openapi.py http://localhost:8080
          test "$(docker compose exec -T box-storage id -u)" = "10001"
      - name: Clean up
        if: always()
        run: docker compose down

  publish:
    name: Publish GHCR image
    needs: [checks, container]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
